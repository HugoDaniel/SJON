[package]
name = "sjon-host"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
resolver = "3"
description = "Rust host wrapping sjon.wasm — validate_document(source, options) for SJON multi-plugin documents"
license = "CC0-1.0"
repository = "https://github.com/hugodaniel/sjon"
publish = false

[dependencies]
wasmtime = { version = "44", default-features = false, features = ["cranelift", "runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
expect-test = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
